<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrega</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="topo">
        <h1>Produtora de Vídeo</h1>
    </div>
    <div class="menu">
        <a href="/web/clientes">Clientes</a>
        <a href="/web/projetos">Projetos</a>
        <a href="/web/entregas">Entregas</a>
    </div>

    <div class="conteudo">

    <h2>Cadastro de Entrega</h2>

    <form th:action="@{/web/entregas/salvar}" th:object="${entrega}" method="post">
        <input type="hidden" th:field="*{idEntrega}">

        Projeto:<br>
        <select th:field="*{idProjeto}" required>
            <option value="">Selecione</option>
            <option th:each="p : ${projetos}" th:value="${p.idProjeto}" th:text="${p.tituloProjeto}"></option>
        </select><br><br>

        Data da entrega:<br>
        <input type="date" th:field="*{dataEntrega}" required><br><br>

        Formato:<br>
        <input type="text" th:field="*{formatoArquivo}" required><br><br>

        Status:<br>
        <input type="text" th:field="*{statusEntrega}" required><br><br>

        <button class="botao" type="submit">Salvar</button>
        <a href="/web/entregas">Voltar</a>
    </form>
    </div>
</body>
</html>

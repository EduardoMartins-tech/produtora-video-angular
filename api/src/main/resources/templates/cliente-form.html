<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="topo">
        <h1>Produtora de Vídeo</h1>
    </div>
    <div class="menu">
        <a href="/web/clientes">Clientes</a>
        <a href="/web/projetos">Projetos</a>
        <a href="/web/entregas">Entregas</a>
    </div>

    <div class="conteudo">

    <h2>Cadastro de Cliente</h2>

    <form th:action="@{/web/clientes/salvar}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{idCliente}">

        Nome:<br>
        <input type="text" th:field="*{nomeCliente}" required><br><br>

        CPF/CNPJ:<br>
        <input type="text" th:field="*{cpfCnpj}" required><br><br>

        Telefone:<br>
        <input type="text" th:field="*{telefone}" required><br><br>

        Email:<br>
        <input type="email" th:field="*{email}" required><br><br>

        <button class="botao" type="submit">Salvar</button>
        <a href="/web/clientes">Voltar</a>
    </form>
    </div>
</body>
</html>
